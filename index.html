    <script>
      // Apply the saved theme before first paint so dark-mode users get no white flash.
      try {
        var t = localStorage.getItem('mfm_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 min-h-screen">

  </body>
